---
mprlab_resources:
  owner: allergy-wheel
  release:
    scheme: semver
  resources:
    website:
      kind: github_pages
      repository: marcopoloresearchlab/allergy_wheel
      branch: gh-pages
      domain: allergy.mprlab.com
      url: https://allergy.mprlab.com/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile.pages
        target: pages
      verification:
        path: /.mprlab-release.json
    mobile:
      kind: mobile_application
      source: mobile
      build_system: local
      build:
        android: scripts/build-store-artifact.mjs
        ios: scripts/build-ios.sh
      android:
        package_name: com.mprlab.allergywheel
        destination: google_play
        track: production
      ios:
        bundle_identifier: com.mprlab.allergywheel
        app_store_id: '6809568034'
        destination: app_store
        track: production
